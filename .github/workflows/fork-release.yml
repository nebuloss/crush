# Fork release: push a tag like v0.97.1-nebuloss.1 and the release appears,
# with standalone linux/amd64 and windows/amd64 binaries.
#
# Only tags with a suffix trigger this, so pushing upstream's plain vX.Y.Z
# tags to the fork does not.
name: Release

on:
  push:
    tags: ["v*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cross-compile
        run: VERSION="$TAG" scripts/fork-dist.sh

      # Uses the pre-installed gh CLI, so the step holding a write token pulls
      # in no third-party code. Create-or-update: re-running after a moved tag
      # or a manual dispatch refreshes the assets instead of failing.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; refreshing it"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
