# Fork CI: cross-compile the shipped targets (linux/amd64, windows/amd64) on
# one Ubuntu runner. Upstream runs the test suite; here we only check that
# the fork builds, and keep the binaries as artifacts.
name: CI

on:
  push:
    branches: [patched]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cross-compile
        run: scripts/fork-dist.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crush-dist
          path: dist/
          if-no-files-found: error
